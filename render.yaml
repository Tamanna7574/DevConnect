services:
  - type: web
    name: devconnect-server
    runtime: node
    plan: starter
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run db:migrate && npm run start --workspace=server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: devconnect-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: http://localhost:5173

databases:
  - name: devconnect-postgres
    plan: starter
    databaseName: devconnect
    user: devconnect_user
